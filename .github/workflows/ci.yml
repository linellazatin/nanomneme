name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Non-blocking: full tree, including development host dependencies.
      # Shipped dependencies remain the blocking audit scope. See CHANGELOG 0.5.1.
      - name: Audit full dependency tree (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
      # Blocking: generated runtimes, tests, shipped dependency audit, packages.
      - run: npm run validate
      - run: git diff --check
      - run: npm pack --dry-run --workspace @openlines/nmnm-core --workspace @openlines/nmnm-ui --workspace @openlines/nmnm-cli --workspace @openlines/nmnm-pi --workspace @openlines/nmnm-opencode

  ui:
    name: Rendered UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      NMNM_UI_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run rendered UI checks
        run: python packages/nmnm-ui/test/browser.py
      - name: Run correctness and accessibility regressions
        run: python packages/nmnm-ui/test/browser_regressions.py
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmnm-ui-${{ matrix.browser }}-evidence
          path: |
            /tmp/nmnm-ui-*.png
            /tmp/nmnm-ui-${{ matrix.browser }}-axe-*.json
          if-no-files-found: warn
          retention-days: 7
