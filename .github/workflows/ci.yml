name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocking: vulnerabilities reachable from shipped packages.
      - run: npm audit --audit-level=high --omit=dev
      # Non-blocking: full tree, including the dev-only Pi host subtree (pinned by Pi's own
      # npm-shrinkwrap.json, so root overrides cannot move it). See CHANGELOG 0.5.1.
      - name: Audit full dependency tree (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm test
      - run: node scripts/check-logging-packages.js
      - run: git diff --check
      - run: npm pack --dry-run --workspace @openlines/nmnm-core --workspace @openlines/nmnm-cli --workspace @openlines/nmnm-pi --workspace @openlines/nmnm-opencode --workspace @openlines/nmnm-codex
