name: Release npm packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Verify release tag
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm test
      - run: git diff --check
      - run: npm pack --dry-run --workspace @openlines/nmnm-core --workspace @openlines/nmnm-cli

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm install -g npm@latest
      - name: Publish core when this version is new
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          version=$(node -p "require('./packages/nmnm-core/package.json').version")
          if npm view "@openlines/nmnm-core@$version" version >/dev/null 2>error.log; then exit 0; fi
          if ! grep -q 'E404' error.log; then cat error.log; exit 1; fi
          npm publish --workspace @openlines/nmnm-core --access public --provenance
      - name: Publish CLI when this version is new
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          version=$(node -p "require('./packages/nmnm-cli/package.json').version")
          if npm view "@openlines/nmnm-cli@$version" version >/dev/null 2>error.log; then exit 0; fi
          if ! grep -q 'E404' error.log; then cat error.log; exit 1; fi
          npm publish --workspace @openlines/nmnm-cli --access public --provenance
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v version="$VERSION" '$0 == "## " version || index($0, "## " version " - ") == 1 { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          test -n "$NOTES"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release from changelog
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
