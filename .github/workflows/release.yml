name: Release npm packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Non-blocking: full tree, including development host dependencies.
      # Shipped dependencies remain the blocking audit scope. See CHANGELOG 0.5.1.
      - name: Audit full dependency tree (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Verify release tag
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v version="$VERSION" '$0 == "## " version || index($0, "## " version " - ") == 1 { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          test -n "$NOTES"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      # Blocking: generated runtimes, tests, shipped dependency audit, packages.
      - run: npm run validate
      - run: git diff --check
      - run: npm pack --dry-run --workspace @openlines/nmnm-core --workspace @openlines/nmnm-ui --workspace @openlines/nmnm-cli --workspace @openlines/nmnm-pi --workspace @openlines/nmnm-opencode

  ui:
    name: Rendered UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
        timeout-minutes: 3
      - name: Install matching Python Playwright package
        timeout-minutes: 3
        run: python -m pip install playwright==1.62.0
      - name: Ensure Chromium headless shell
        timeout-minutes: 2
        # The pinned image already contains the browsers and Linux dependencies; no APT.
        run: python -m playwright install --only-shell chromium
      - name: Run all browser workflow and accessibility checks
        timeout-minutes: 6
        run: bash scripts/run-ui-browser-checks.sh
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmnm-ui-browser-evidence
          path: |
            /tmp/nmnm-ui-*.png
            /tmp/nmnm-ui-*-axe-*.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [validate, ui]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm install -g npm@latest
      - name: Publish core when this version is new
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          version=$(node -p "require('./packages/nmnm-core/package.json').version")
          if npm view "@openlines/nmnm-core@$version" version >/dev/null 2>error.log; then exit 0; fi
          if ! grep -q 'E404' error.log; then cat error.log; exit 1; fi
          npm publish --workspace @openlines/nmnm-core --access public --provenance
      - name: Publish UI when this version is new
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          version=$(node -p "require('./packages/nmnm-ui/package.json').version")
          if npm view "@openlines/nmnm-ui@$version" version >/dev/null 2>error.log; then exit 0; fi
          if ! grep -q 'E404' error.log; then cat error.log; exit 1; fi
          npm publish --workspace @openlines/nmnm-ui --access public --provenance
      - name: Publish CLI when this version is new
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          version=$(node -p "require('./packages/nmnm-cli/package.json').version")
          if npm view "@openlines/nmnm-cli@$version" version >/dev/null 2>error.log; then exit 0; fi
          if ! grep -q 'E404' error.log; then cat error.log; exit 1; fi
          npm publish --workspace @openlines/nmnm-cli --access public --provenance
      - name: Publish Pi adapter when this version is new
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          version=$(node -p "require('./adapters/pi/package.json').version")
          if npm view "@openlines/nmnm-pi@$version" version >/dev/null 2>error.log; then exit 0; fi
          if ! grep -q 'E404' error.log; then cat error.log; exit 1; fi
          npm publish --workspace @openlines/nmnm-pi --access public --provenance
      - name: Publish OpenCode adapter when this version is new
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          version=$(node -p "require('./adapters/opencode/package.json').version")
          if npm view "@openlines/nmnm-opencode@$version" version >/dev/null 2>error.log; then exit 0; fi
          if ! grep -q 'E404' error.log; then cat error.log; exit 1; fi
          npm publish --workspace @openlines/nmnm-opencode --access public --provenance
      - name: Create GitHub Release from changelog
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.validate.outputs.notes }}
